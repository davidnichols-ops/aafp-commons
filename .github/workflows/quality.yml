name: quality

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync development environment
        run: uv sync --extra dev
      - name: Test
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check src tests examples
      - name: Type check
        run: uv run mypy src
      - name: Validate protocol documents
        run: make schemas
      - name: Build distributions
        run: uv build
      - name: Verify packaged protocols and constitutions
        run: |
          test "$(unzip -l dist/*.whl | grep -c 'schema.json')" -eq 27
          test "$(unzip -l dist/*.whl | grep -c 'constitutions/.*/1.0.0.json')" -eq 3
          test "$(tar -tzf dist/*.tar.gz | grep -c 'constitutions/.*/1.0.0.json')" -eq 3
      - name: Smoke-test agent package setup
        run: |
          uv run aafp-commons constitutions install-all "$RUNNER_TEMP/commons-data"
          uv run aafp-commons constitutions verify "$RUNNER_TEMP/commons-data"
